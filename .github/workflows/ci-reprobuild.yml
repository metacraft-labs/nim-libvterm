name: CI (reprobuild)

# Additive side-by-side CI run that re-plays the project's
# deterministic dev env through reprobuild instead of `nix develop` or
# `env.ps1`. Runs alongside the existing `ci.yml` (`nix`) and any
# `windows-build.yml` (`windows-diy`) entries so regressions in either
# of the older paths still gate merges — see
# `codetracer-specs/Repo-Requirements.md` §2.9 and
# `metacraft-dev-guidelines/policies/ci-shared-dev-env.md` §4 for the
# rollout shape.
#
# The `setup-dev-env` composite action accepts `env-flavor: reprobuild`
# (target state per the policy). When the action's reprobuild branch
# lands, this workflow exercises it end-to-end on every supported
# host without any other repo-side change.

on:
  push:
    branches: [main, dev, stable]
  pull_request:
    branches: [main, dev, stable]

jobs:
  reprobuild:
    name: ${{ matrix.os }}-${{ matrix.arch }} — repro build/test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            arch: x64
            runner: [self-hosted, linux, x64]
          - os: linux
            arch: arm64
            runner: [self-hosted, linux, arm64]
          - os: macos
            arch: arm64
            runner: [self-hosted, macos, arm64]
          - os: windows
            arch: x64
            runner: [self-hosted, windows, x64]
          - os: windows
            arch: arm64
            runner: [self-hosted, windows, arm64]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      # Mint a GitHub App installation token via the CI Token Provider
      # app so the reprobuild flake/sibling steps can clone private
      # metacraft-labs repos (codetracer-native-recorder, runquota,
      # repo-workspaces, etc.).  GitHub free plan restricts org-level
      # secrets with visibility ALL from being readable in private repos,
      # so we mint per-run tokens from the app secrets stored at repo
      # level (CI_TOKEN_PROVIDER_APP_ID + CI_TOKEN_PROVIDER_PRIVATE_KEY).
      # Minted before the sibling clones so the workspace-lock manifest
      # checkout (private metacraft-manifests) can authenticate.
      - name: Mint installation token for cross-repo sibling clones
        id: ci_token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.CI_TOKEN_PROVIDER_APP_ID }}
          private-key: ${{ secrets.CI_TOKEN_PROVIDER_PRIVATE_KEY }}
          owner: metacraft-labs

      - name: Install Nix for the declared Unix shell
        if: runner.os != 'Windows'
        uses: metacraft-labs/metacraft-github-actions/setup-nix@dev
        with:
          gh-token: ${{ steps.ci_token.outputs.token }}

      - name: Expose the declared non-SIP Bash
        if: runner.os != 'Windows'
        run: |
          set -euo pipefail
          nix develop --no-update-lock-file --command bash -c '
            set -euo pipefail
            shell_path="$(command -v bash)"
            case "$shell_path" in
              /nix/store/*/bin/bash) dirname "$shell_path" >> "$GITHUB_PATH" ;;
              *) echo "Expected declared Nix Bash" >&2; exit 1 ;;
            esac
          '

      - name: Setup dev env (reprobuild flavor)
        id: source_setup
        # Source mode supplies the verified CLI and staged Nix helper.
        uses: metacraft-labs/metacraft-github-actions/setup-dev-env@dev
        with:
          env-flavor: reprobuild
          repro-from-source: ${{ runner.os != 'Windows' && 'true' || 'false' }}
          repro-build-pin: "76659f5730ecf698b1963c656494d2cb66eb256d"
          gh-token: ${{ steps.ci_token.outputs.token }}

      - name: Collect failed Linux ARM bootstrap resource scope
        if: failure() && matrix.os == 'linux' && matrix.arch == 'arm64' && steps.source_setup.outcome == 'failure'
        shell: bash
        run: bash .github/scripts/linux-arm-bootstrap-resource-receipt.sh

      - name: Upload failed Linux ARM bootstrap resource scope
        if: failure() && matrix.os == 'linux' && matrix.arch == 'arm64' && steps.source_setup.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: linux-arm-bootstrap-resource-scope
          path: .repro-bootstrap-resource/
          if-no-files-found: error
          include-hidden-files: true

      - name: Assert measured Unix Repro artifacts
        if: runner.os != 'Windows'
        run: |
          set -euo pipefail
          test "$(git -C .reprobuild-src rev-parse HEAD)" = 76659f5730ecf698b1963c656494d2cb66eb256d
          test -z "$(git -C .reprobuild-src status --porcelain)"
          test "$(command -v repro)" = "$GITHUB_WORKSPACE/.reprobuild-src/build/bin/repro"
          test "${REPROBUILD_NIX_DAEMON_BIN:?missing staged helper}" = "$GITHUB_WORKSPACE/.reprobuild-src/build/bin/reprobuild-nix-daemon"
          test -x "$REPROBUILD_NIX_DAEMON_BIN"
          "$REPROBUILD_NIX_DAEMON_BIN" --help
          printf 'source=%s cli=%s helper=%s\n' "$(git -C .reprobuild-src rev-parse HEAD)" "$(command -v repro)" "$REPROBUILD_NIX_DAEMON_BIN"
          repro --version

      - name: Provision the owning native Windows x64 SDK
        if: runner.os == 'Windows' && matrix.arch == 'x64'
        shell: pwsh
        run: ./.github/scripts/windows-native-compiler-sdk.ps1

      - name: Record native Windows executable provenance
        if: runner.os == 'Windows'
        shell: pwsh
        run: dev-exec powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File .github/scripts/windows-native-provenance.ps1

      - name: repro build
        # Build the owning complete 39-module terminal corpus.
        env:
          REPRO_PROVISIONING_CONTRIBUTOR: ${{ runner.os != 'Windows' && 'libvterm-owning-nim-zlib-sdk' || '' }}
        run: dev-exec repro build ${{ runner.os != 'Windows' && '--tool-provisioning=nix' || '' }}

      - name: repro test
        # Materialises the `test` collection.
        env:
          REPRO_PROVISIONING_CONTRIBUTOR: ${{ runner.os != 'Windows' && 'libvterm-owning-nim-zlib-sdk' || '' }}
        run: dev-exec repro test ${{ runner.os != 'Windows' && '--tool-provisioning=nix' || '' }}

      - name: Bind the action-selected native Windows Nim
        if: runner.os == 'Windows' && runner.arch == 'X64'
        shell: pwsh
        run: ./.github/scripts/bind-selected-native-nim.ps1

      - name: just build (cross-check)
        # Re-runs the original `just build` through the owning committed flake so
        # we catch silent divergences between `repro build` outputs
        # and what the dev shell + Justfile produce today.
        run: ${{ runner.os != 'Windows' && 'nix develop . --no-update-lock-file --command just build' || 'dev-exec just build' }}

      - name: just test (cross-check)
        run: ${{ runner.os != 'Windows' && 'nix develop . --no-update-lock-file --command just test' || 'dev-exec just test' }}

      # Diagnostics on failure. Three things below are load-bearing:
      #
      # 1. `include-hidden-files: true`. actions/upload-artifact@v4 defaults this
      #    input to false, and @actions/glob then skips any entry it traverses whose
      #    own basename starts with "." (internal-globber.ts:
      #    `if (options.excludeHiddenFiles && path.basename(item.path).match(/^\./))
      #    continue`). The old `path: .repro/` made `.repro` itself the search root,
      #    so it was skipped outright and this step logged
      #      "No files were found with the provided path: target/ .repro/"
      #    which `if-no-files-found: ignore` then swallowed. Net effect: the build
      #    engine's per-action stdio captures -- `<outDir>/build-engine-cache/
      #    actions/<actionId>.stderr.log`, see repro_build_engine.nim -- have never
      #    been uploaded from any leg of this workflow, on any platform.
      # 2. Narrow paths. A whole `.repro/` tree measures ~1.1 GiB (dominated by
      #    build-engine-cache/monitor-depfiles and dependency-evidence); the failure
      #    report plus the per-action logs are ~600 KiB. `target/` was dropped: it is
      #    a build-output tree rather than a log tree, it matches nothing in the Nim
      #    repos, and where it does match it would permanently mask the warning below.
      # 3. `if-no-files-found: warn` (the action's own default). This step only runs
      #    on failure, so a warning costs nothing -- and it is exactly what would have
      #    surfaced (1) years ago instead of hiding it behind a green step.
      #
      # Context, 2026-09: no leg of this workflow is green on ANY platform. Census of
      # the job records: linux-x64 77 failure / 19 cancelled / 0 success, linux-arm64
      # 77/19/0, macos-arm64 75/25/0, windows-x64 61/35/0. The only two successes on
      # record are from 2026-07-06, under the pre-rename job names. The arm64 leg
      # fails earlier than x64, and x64 fails for an unrelated project-level reason
      # (`cannot open file: results`, codetracer_ct_print.nim(24, 8)). These
      # artifacts are the only way to find out why any of it actually fails.
      - name: Original native build comparison after Windows failure
        if: failure() && runner.os == 'Windows'
        # Supplementary comparison only; the original monitored failure remains.
        run: dev-exec just build

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: reprobuild-logs-${{ matrix.os }}-${{ matrix.arch }}
          path: |
            .repro/build/*/build-failure-report.json
            .repro/windows-native-provenance/*.json
            .repro/build/*/*-tool-identities.inspect.json
            build/nimcache/**/*.json
            .repro/build/*/build-engine-cache/actions/
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: warn
