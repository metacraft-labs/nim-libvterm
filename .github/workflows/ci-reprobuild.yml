name: CI (reprobuild)

# Additive side-by-side CI run that re-plays the project's
# deterministic dev env through reprobuild instead of `nix develop` or
# `env.ps1`. Runs alongside the existing `ci.yml` (`nix`) and any
# `windows-build.yml` (`windows-diy`) entries so regressions in either
# of the older paths still gate merges — see
# `codetracer-specs/Repo-Requirements.md` §2.9 and
# `metacraft-dev-guidelines/policies/ci-shared-dev-env.md` §4 for the
# rollout shape.
#
# The `setup-dev-env` composite action accepts `env-flavor: reprobuild`
# (target state per the policy). When the action's reprobuild branch
# lands, this workflow exercises it end-to-end on every supported
# host without any other repo-side change.

on:
  push:
    branches: [main, dev, stable]
  pull_request:
    branches: [main, dev, stable]

jobs:
  reprobuild:
    name: ${{ matrix.os }}-${{ matrix.arch }} — repro build/test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            arch: x64
            runner: [self-hosted, linux, x64]
          - os: linux
            arch: arm64
            runner: [self-hosted, linux, arm64]
          - os: macos
            arch: arm64
            runner: [self-hosted, macos, arm64]
          - os: windows
            arch: x64
            runner: [self-hosted, windows, x64]
          - os: windows
            arch: arm64
            runner: [self-hosted, windows, arm64]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Retain bounded ancestry for the committed root lock revision.
          fetch-depth: 32

      # Mint a GitHub App installation token via the CI Token Provider
      # app so the reprobuild flake/sibling steps can clone private
      # metacraft-labs repos (codetracer-native-recorder, runquota,
      # repo-workspaces, etc.).  GitHub free plan restricts org-level
      # secrets with visibility ALL from being readable in private repos,
      # so we mint per-run tokens from the app secrets stored at repo
      # level (CI_TOKEN_PROVIDER_APP_ID + CI_TOKEN_PROVIDER_PRIVATE_KEY).
      # Minted before the sibling clones so the workspace-lock manifest
      # checkout (private metacraft-manifests) can authenticate.
      - name: Mint installation token for cross-repo sibling clones
        id: ci_token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.CI_TOKEN_PROVIDER_APP_ID }}
          private-key: ${{ secrets.CI_TOKEN_PROVIDER_PRIVATE_KEY }}
          owner: metacraft-labs

      - name: Install Nix for the declared Unix shell
        if: runner.os != 'Windows'
        uses: metacraft-labs/metacraft-github-actions/setup-nix@dev
        with:
          gh-token: ${{ steps.ci_token.outputs.token }}

      - name: Expose the declared non-SIP Bash
        if: runner.os != 'Windows'
        run: |
          set -euo pipefail
          nix develop --no-update-lock-file --command bash -c '
            set -euo pipefail
            shell_path="$(command -v bash)"
            case "$shell_path" in
              /nix/store/*/bin/bash) dirname "$shell_path" >> "$GITHUB_PATH" ;;
              *) echo "Expected declared Nix Bash" >&2; exit 1 ;;
            esac
          '

      - name: Setup dev env (reprobuild flavor)
        id: source_setup
        # Source mode supplies the verified CLI and staged Nix helper.
        uses: metacraft-labs/metacraft-github-actions/setup-dev-env@dev
        env:
          WINDOWS_DIY_ARCH_OVERRIDE: ${{ runner.os == 'Windows' && runner.arch == 'ARM64' && 'x64' || '' }}
        with:
          env-flavor: reprobuild
          # The Reprobuild engine is the fleet pin, the action's default:
          # `pins/reprobuild.json` in metacraft-labs/metacraft-github-actions,
          # built against the bootstrap libraries that pinned revision locks
          # (Windows ARM64 as x64 under emulation), so CI runs the engine the
          # fleet runs. tests/test_ci_engine_reads_committed_lock.py checks that
          # this engine reads the committed v3 lock and refuses an override in
          # either workflow. The native Windows ARM64 SDK step passes the
          # engine setup-dev-env reports as -EngineRevision;
          # tests/test_native_arm_runquota_policy.py checks that, and derives
          # the runquota and nim-shm-lease revisions from it.
          gh-token: ${{ steps.ci_token.outputs.token }}
          app-id: ${{ secrets.CI_TOKEN_PROVIDER_APP_ID }}
          app-private-key: ${{ secrets.CI_TOKEN_PROVIDER_PRIVATE_KEY }}
          # The native Windows ARM64 steps below refuse inherited Git runtime
          # configuration and an inherited RunQuota or toolchain, so on that leg
          # setup-dev-env installs no job-scoped Git credential and keeps the
          # x64 source build's environment out of later steps.
          # tests/test_native_arm_job_env.py checks both.
          git-access: ${{ runner.os == 'Windows' && matrix.arch == 'arm64' && 'none' || 'read' }}
          export-build-env: ${{ runner.os == 'Windows' && matrix.arch == 'arm64' && 'false' || 'true' }}

      - name: Collect failed Linux ARM bootstrap resource scope
        if: failure() && matrix.os == 'linux' && matrix.arch == 'arm64' && steps.source_setup.outcome == 'failure'
        shell: bash
        run: bash .github/scripts/linux-arm-bootstrap-resource-receipt.sh

      - name: Upload failed Linux ARM bootstrap resource scope
        if: failure() && matrix.os == 'linux' && matrix.arch == 'arm64' && steps.source_setup.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: linux-arm-bootstrap-resource-scope
          path: .repro-bootstrap-resource/
          if-no-files-found: error
          include-hidden-files: true

      - name: Assert measured Unix Repro artifacts
        # setup-dev-env reports the engine it installed. It is the pin, not an
        # override, and a source build is a clean checkout of that commit whose
        # binary and staged Nix helper are the ones on PATH. A Linux
        # binary-cache hit installs the pinned commit's Nix package instead.
        if: runner.os != 'Windows'
        env:
          REPRO_COMMIT: ${{ steps.source_setup.outputs.repro-commit }}
          REPRO_ORIGIN: ${{ steps.source_setup.outputs.repro-origin }}
          REPRO_INSTALL_SOURCE: ${{ steps.source_setup.outputs.repro-install-source }}
        run: |
          set -euo pipefail
          echo "repro ${REPRO_COMMIT} (origin ${REPRO_ORIGIN}, ${REPRO_INSTALL_SOURCE})"
          [[ "${REPRO_COMMIT}" =~ ^[0-9a-f]{40}$ ]]
          test "${REPRO_ORIGIN}" = pin
          if [ "${REPRO_INSTALL_SOURCE}" = source ]; then
            test "$(git -C .reprobuild-src rev-parse HEAD)" = "${REPRO_COMMIT}"
            test -z "$(git -C .reprobuild-src status --porcelain)"
            test "$(command -v repro)" = "$GITHUB_WORKSPACE/.reprobuild-src/build/bin/repro"
            test "${REPROBUILD_NIX_DAEMON_BIN:?missing staged helper}" = "$GITHUB_WORKSPACE/.reprobuild-src/build/bin/reprobuild-nix-daemon"
          fi
          test -x "${REPROBUILD_NIX_DAEMON_BIN:?missing staged helper}"
          "$REPROBUILD_NIX_DAEMON_BIN" --help
          printf 'source=%s cli=%s helper=%s\n' "${REPRO_COMMIT}" "$(command -v repro)" "$REPROBUILD_NIX_DAEMON_BIN"
          repro --version

      - name: Provide the engine and runquota sources
        # The lock reader and the native ARM64 derivation read the engine's own
        # source revision and the runquota revision its flake.lock pins. A
        # source build left both checkouts (.reprobuild-src, runquota); a
        # binary-cache install did not, so fetch those two commits.
        id: engine_sources
        if: matrix.os == 'linux'
        shell: bash
        env:
          REPRO_COMMIT: ${{ steps.source_setup.outputs.repro-commit }}
          REPRO_INSTALL_SOURCE: ${{ steps.source_setup.outputs.repro-install-source }}
        run: |
          set -euo pipefail
          if [ "${REPRO_INSTALL_SOURCE}" = source ]; then
            printf 'reprobuild=%s\nrunquota=%s\n' .reprobuild-src runquota >> "$GITHUB_OUTPUT"
            exit 0
          fi
          engine="${RUNNER_TEMP}/reprobuild-engine-source"
          git init -q "$engine"
          git -C "$engine" fetch -q --depth 1 https://github.com/metacraft-labs/reprobuild.git "${REPRO_COMMIT}"
          runquota_rev="$(git -C "$engine" show "${REPRO_COMMIT}:flake.lock" | python3 -c 'import json,sys; x=json.load(sys.stdin); print(x["nodes"][x["nodes"][x["root"]]["inputs"]["runquota-src"]]["locked"]["rev"])')"
          runquota="${RUNNER_TEMP}/runquota-source"
          git init -q "$runquota"
          git -C "$runquota" fetch -q --depth 1 https://github.com/metacraft-labs/runquota.git "$runquota_rev"
          printf 'reprobuild=%s\nrunquota=%s\n' "$engine" "$runquota" >> "$GITHUB_OUTPUT"

      - name: Verify CI engine reads the committed lock
        if: matrix.os == 'linux'
        shell: bash
        env:
          REPRO_COMMIT: ${{ steps.source_setup.outputs.repro-commit }}
          ENGINE_SOURCE: ${{ steps.engine_sources.outputs.reprobuild }}
        run: nix develop . --no-update-lock-file --command python3 tests/test_ci_engine_reads_committed_lock.py --reprobuild "$ENGINE_SOURCE" --revision "$REPRO_COMMIT"

      - name: Verify the native ARM64 runquota inputs derive from the engine pin
        if: matrix.os == 'linux'
        shell: bash
        env:
          REPRO_COMMIT: ${{ steps.source_setup.outputs.repro-commit }}
          ENGINE_SOURCE: ${{ steps.engine_sources.outputs.reprobuild }}
          RUNQUOTA_SOURCE: ${{ steps.engine_sources.outputs.runquota }}
        run: nix develop . --no-update-lock-file --command python3 tests/test_native_arm_runquota_policy.py --reprobuild "$ENGINE_SOURCE" --runquota "$RUNQUOTA_SOURCE" --revision "$REPRO_COMMIT"

      - name: Verify the native ARM64 leg asks setup-dev-env for a clean job environment
        if: matrix.os == 'linux'
        shell: bash
        run: python3 tests/test_native_arm_job_env.py

      - name: Provision the owning native Windows x64 SDK
        if: runner.os == 'Windows' && matrix.arch == 'x64'
        shell: pwsh
        env:
          REPRO_COMMIT: ${{ steps.source_setup.outputs.repro-commit }}
          REPRO_ORIGIN: ${{ steps.source_setup.outputs.repro-origin }}
        run: ./.github/scripts/windows-native-compiler-sdk.ps1

      - name: Authenticate owning checkout Git runtime configuration
        if: runner.os == 'Windows' && matrix.arch == 'arm64'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $inherited = @(Get-ChildItem Env: | Where-Object { $_.Name -match '^GIT_CONFIG_(COUNT|PARAMETERS|KEY_[0-9]+|VALUE_[0-9]+)$' })
          if ($inherited.Count -ne 0) { throw 'Owning checkout inherits unadmitted Git runtime configuration' }

      - name: Check out clean owning native Windows ARM64 source
        if: runner.os == 'Windows' && matrix.arch == 'arm64'
        uses: actions/checkout@v4
        # Source-State authenticates physical bytes against the pinned Git blobs.
        # Scope conversion policy to this checkout, without changing host config.
        env:
          GIT_CONFIG_COUNT: "1"
          GIT_CONFIG_KEY_0: core.autocrlf
          GIT_CONFIG_VALUE_0: "false"
        with:
          ref: ${{ github.sha }}
          path: native-owning-source
      - name: Provision the owning native Windows ARM64 SDK
        if: runner.os == 'Windows' && matrix.arch == 'arm64'
        shell: pwsh
        working-directory: ${{ runner.os == 'Windows' && matrix.arch == 'arm64' && 'native-owning-source' || '.' }}
        env:
          REPRO_COMMIT: ${{ steps.source_setup.outputs.repro-commit }}
        run: |
          ./ci/windows-native-arm-sdk.ps1 -OwnedPathHelper ./ci/native-python-owned-path.ps1 -SourceRoot "$env:GITHUB_WORKSPACE/native-owning-source" -SourceRevision '${{ github.sha }}' -EngineRevision "$env:REPRO_COMMIT" -FailureEvidenceDirectory "$env:GITHUB_WORKSPACE/native-arm-sdk-failure-evidence" -VerifyNativeRunquotaControls

      - name: Record native Windows executable provenance
        if: runner.os == 'Windows'
        shell: pwsh
        working-directory: ${{ runner.os == 'Windows' && matrix.arch == 'arm64' && 'native-owning-source' || '.' }}
        run: dev-exec powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File .github/scripts/windows-native-provenance.ps1

      - name: Refresh authentication before repro build
        if: runner.os != 'Windows'
        uses: metacraft-labs/metacraft-github-actions/refresh-build-auth@dev
        with:
          app-id: ${{ secrets.CI_TOKEN_PROVIDER_APP_ID || vars.CI_TOKEN_PROVIDER_APP_ID }}
          private-key: ${{ secrets.CI_TOKEN_PROVIDER_PRIVATE_KEY }}
          owner: metacraft-labs

      - name: repro build
        # Build the owning complete 39-module terminal corpus.
        working-directory: ${{ runner.os == 'Windows' && matrix.arch == 'arm64' && 'native-owning-source' || '.' }}
        run: ${{ runner.os != 'Windows' && 'nix develop . --no-update-lock-file --command repro build --tool-provisioning=path' || format('dev-exec repro build {0}', matrix.arch == 'arm64' && '--tool-provisioning=path' || '') }}

      - name: Refresh authentication before repro test
        if: runner.os != 'Windows'
        uses: metacraft-labs/metacraft-github-actions/refresh-build-auth@dev
        with:
          app-id: ${{ secrets.CI_TOKEN_PROVIDER_APP_ID || vars.CI_TOKEN_PROVIDER_APP_ID }}
          private-key: ${{ secrets.CI_TOKEN_PROVIDER_PRIVATE_KEY }}
          owner: metacraft-labs

      - name: repro test
        # Materialises the `test` collection.
        working-directory: ${{ runner.os == 'Windows' && matrix.arch == 'arm64' && 'native-owning-source' || '.' }}
        run: ${{ runner.os != 'Windows' && 'nix develop . --no-update-lock-file --command repro test --tool-provisioning=path' || format('dev-exec repro test {0}', matrix.arch == 'arm64' && '--tool-provisioning=path' || '') }}

      - name: Bind the action-selected native Windows Nim
        if: runner.os == 'Windows' && runner.arch == 'X64'
        shell: pwsh
        working-directory: ${{ runner.os == 'Windows' && matrix.arch == 'arm64' && 'native-owning-source' || '.' }}
        env:
          REPRO_COMMIT: ${{ steps.source_setup.outputs.repro-commit }}
          REPRO_ORIGIN: ${{ steps.source_setup.outputs.repro-origin }}
        run: ./.github/scripts/bind-selected-native-nim.ps1

      - name: Refresh authentication before just build
        if: runner.os != 'Windows'
        uses: metacraft-labs/metacraft-github-actions/refresh-build-auth@dev
        with:
          app-id: ${{ secrets.CI_TOKEN_PROVIDER_APP_ID || vars.CI_TOKEN_PROVIDER_APP_ID }}
          private-key: ${{ secrets.CI_TOKEN_PROVIDER_PRIVATE_KEY }}
          owner: metacraft-labs

      - name: just build (cross-check)
        # Re-runs the original `just build` through the owning committed flake so
        # we catch silent divergences between `repro build` outputs
        # and what the dev shell + Justfile produce today.
        working-directory: ${{ runner.os == 'Windows' && matrix.arch == 'arm64' && 'native-owning-source' || '.' }}
        run: ${{ runner.os != 'Windows' && 'nix develop . --no-update-lock-file --command just build' || 'dev-exec just build' }}

      - name: Refresh authentication before just test
        if: runner.os != 'Windows'
        uses: metacraft-labs/metacraft-github-actions/refresh-build-auth@dev
        with:
          app-id: ${{ secrets.CI_TOKEN_PROVIDER_APP_ID || vars.CI_TOKEN_PROVIDER_APP_ID }}
          private-key: ${{ secrets.CI_TOKEN_PROVIDER_PRIVATE_KEY }}
          owner: metacraft-labs

      - name: just test (cross-check)
        working-directory: ${{ runner.os == 'Windows' && matrix.arch == 'arm64' && 'native-owning-source' || '.' }}
        run: ${{ runner.os != 'Windows' && 'nix develop . --no-update-lock-file --command just test' || 'dev-exec just test' }}

      # Diagnostics on failure. Three things below are load-bearing:
      #
      # 1. `include-hidden-files: true`. actions/upload-artifact@v4 defaults this
      #    input to false, and @actions/glob then skips any entry it traverses whose
      #    own basename starts with "." (internal-globber.ts:
      #    `if (options.excludeHiddenFiles && path.basename(item.path).match(/^\./))
      #    continue`). The old `path: .repro/` made `.repro` itself the search root,
      #    so it was skipped outright and this step logged
      #      "No files were found with the provided path: target/ .repro/"
      #    which `if-no-files-found: ignore` then swallowed. Net effect: the build
      #    engine's per-action stdio captures -- `<outDir>/build-engine-cache/
      #    actions/<actionId>.stderr.log`, see repro_build_engine.nim -- have never
      #    been uploaded from any leg of this workflow, on any platform.
      # 2. Narrow paths. A whole `.repro/` tree measures ~1.1 GiB (dominated by
      #    build-engine-cache/monitor-depfiles and dependency-evidence); the failure
      #    report plus the per-action logs are ~600 KiB. `target/` was dropped: it is
      #    a build-output tree rather than a log tree, it matches nothing in the Nim
      #    repos, and where it does match it would permanently mask the warning below.
      # 3. `if-no-files-found: warn` (the action's own default). This step only runs
      #    on failure, so a warning costs nothing -- and it is exactly what would have
      #    surfaced (1) years ago instead of hiding it behind a green step.
      #
      # Context, 2026-09: no leg of this workflow is green on ANY platform. Census of
      # the job records: linux-x64 77 failure / 19 cancelled / 0 success, linux-arm64
      # 77/19/0, macos-arm64 75/25/0, windows-x64 61/35/0. The only two successes on
      # record are from 2026-07-06, under the pre-rename job names. The arm64 leg
      # fails earlier than x64, and x64 fails for an unrelated project-level reason
      # (`cannot open file: results`, codetracer_ct_print.nim(24, 8)). These
      # artifacts are the only way to find out why any of it actually fails.
      - name: Original native build comparison after Windows failure
        # On arm64 the step runs inside native-owning-source, which only the
        # clean-checkout step creates. When an earlier step failed before that
        # checkout, there is nothing to compare, and starting the shell in a
        # missing directory would replace the real error with "The directory
        # name is invalid". So on arm64 it runs only when the checkout exists.
        if: failure() && runner.os == 'Windows' && (matrix.arch != 'arm64' || hashFiles('native-owning-source/Justfile') != '')
        # Supplementary comparison only; the original monitored failure remains.
        working-directory: ${{ runner.os == 'Windows' && matrix.arch == 'arm64' && 'native-owning-source' || '.' }}
        run: dev-exec just build

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: reprobuild-logs-${{ matrix.os }}-${{ matrix.arch }}
          path: |
            native-arm-sdk-failure-evidence/
            .repro/build/*/build-failure-report.json
            native-owning-source/.repro/build/*/build-failure-report.json
            native-owning-source/.repro/build/*/build-engine-cache/actions/
            native-owning-source/.repro/windows-native-provenance/*.json
            native-owning-source/build/nimcache/**/*.json
            .repro/windows-native-provenance/*.json
            .repro/build/*/*-tool-identities.inspect.json
            build/nimcache/**/*.json
            .repro/build/*/build-engine-cache/actions/
            native-owning-source/.repro/build/*/*-tool-identities.inspect.json
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: warn
